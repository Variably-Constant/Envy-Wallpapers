[package]
name = "wallpaper-format"
version = "0.1.0"
edition = "2021"
description = "The format of a wallpaper Envy downloads: its wallpaper.toml, the files beside it and the checks they pass, the package it travels in and the signed catalog that lists it, with the envy-wallpaper tool that checks, packs and lists them"
license = "MIT"

[lib]
path = "src/lib.rs"

[[bin]]
name = "envy-wallpaper"
path = "src/bin/envy-wallpaper.rs"

[dependencies]
imagesize = "0.15.0"
minisign-verify = "0.3.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tar = { version = "0.4.46", default-features = false }
toml = "1.2.1"

[dev-dependencies]
minisign = "0.10.0"
